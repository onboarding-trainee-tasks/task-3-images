global:
  resolve_timeout: 5m

  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "monitoring.task.2.onb@gmail.com"
  smtp_auth_username: "monitoring.task.2.onb@gmail.com"
  smtp_auth_password_file: "/etc/alertmanager/secrets/smtp_password"
  smtp_require_tls: true

route:
  receiver: email-default

  group_by:
    - alertname
    - environment
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email-default

    email_configs:
      - to: "monitoring.task.2.onb@gmail.com"
        send_resolved: true

        headers:
          Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'