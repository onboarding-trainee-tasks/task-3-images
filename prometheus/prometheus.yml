global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names:
            - alertmanager.llm.local
          type: A
          port: 9093
          refresh_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: prometheus-node-exporter
    static_configs:
      - targets:
          - localhost:9100

  - job_name: grafana
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - grafana.llm.local
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: alertmanager
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - alertmanager.llm.local
        type: A
        port: 9093
        refresh_interval: 15s

  - job_name: grafana-node-exporter
    dns_sd_configs:
      - names:
          - grafana.llm.local
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: open-webui-node-exporter
    dns_sd_configs:
      - names:
          - open-webui.llm.local
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: ollama-node-exporter
    dns_sd_configs:
      - names:
          - ollama.llm.local
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: alertmanager-node-exporter
    dns_sd_configs:
      - names:
          - alertmanager.llm.local
        type: A
        port: 9100
        refresh_interval: 15s

  - job_name: bastion-node-exporter
    ec2_sd_configs:
      - region: eu-central-1
        port: 9100
        refresh_interval: 60s

        filters:
          - name: instance-state-name
            values:
              - running

          - name: tag:Role
            values:
              - bastion

    relabel_configs:
      - source_labels:
          - __meta_ec2_tag_Name
        target_label: instance_name

      - source_labels:
          - __meta_ec2_instance_id
        target_label: instance_id

      - source_labels:
          - __meta_ec2_private_ip
        target_label: private_ip