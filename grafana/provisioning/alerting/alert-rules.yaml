apiVersion: 1

groups:
  - orgId: 1
    name: ECS task resources
    folder: Infrastructure
    interval: 1m

    rules:
      - uid: llmdevcpuhigh
        title: "[llm]-[test]-[ecs]-[high]-[cpu]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                100 * (
                  1 -
                  avg by (job, instance) (
                    rate(
                      node_cpu_seconds_total{
                        job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter",
                        mode="idle"
                      }[5m]
                    )
                  )
                )

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: C
            datasourceUid: __expr__

            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                      - 0
                    type: gt

                  operator:
                    type: and

                  query:
                    params: []

                  reducer:
                    params: []
                    type: avg

                  type: query

              datasource:
                name: Expression
                type: __expr__
                uid: __expr__

              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 2m

        annotations:
          summary: "High ECS CPU usage"
          description: >-
            CPU usage reported by {{ $labels.job }}
            on {{ $labels.instance }} is above 90 percent.

        labels:
          project: llm
          environment: test
          source: grafana
          component: ecs
          metric: cpu
          severity: high

        notification_settings:
          receiver: alertmanager

        isPaused: false

      - uid: llmdevcpulow
        title: "[llm]-[test]-[ecs]-[low]-[cpu]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                100 * (
                  1 -
                  avg by (job, instance) (
                    rate(
                      node_cpu_seconds_total{
                        job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter",
                        mode="idle"
                      }[5m]
                    )
                  )
                )

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: C
            datasourceUid: __expr__

            model:
              conditions:
                - evaluator:
                    params:
                      - 70
                      - 0
                    type: gt

                  operator:
                    type: and

                  query:
                    params: []

                  reducer:
                    params: []
                    type: avg

                  type: query

              datasource:
                name: Expression
                type: __expr__
                uid: __expr__

              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 5m

        annotations:
          summary: "Elevated ECS CPU usage"
          description: >-
            CPU usage reported by {{ $labels.job }}
            on {{ $labels.instance }} is above 70 percent.

        labels:
          project: llm
          environment: test
          source: grafana
          component: ecs
          metric: cpu
          severity: low

        notification_settings:
          receiver: alertmanager

        isPaused: false

      - uid: llmdevmemhigh
        title: "[llm]-[test]-[ecs]-[high]-[memory]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                100 * (
                  1 -
                  (
                    node_memory_MemAvailable_bytes{
                      job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter"
                    }
                    /
                    node_memory_MemTotal_bytes{
                      job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter"
                    }
                  )
                )

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: C
            datasourceUid: __expr__

            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                      - 0
                    type: gt

                  operator:
                    type: and

                  query:
                    params: []

                  reducer:
                    params: []
                    type: avg

                  type: query

              datasource:
                name: Expression
                type: __expr__
                uid: __expr__

              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 2m

        annotations:
          summary: "High ECS memory usage"
          description: >-
            Memory usage reported by {{ $labels.job }}
