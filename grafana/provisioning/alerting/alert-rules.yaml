        for: 2m

        annotations:
          summary: "High ECS filesystem usage"
          description: >-
            Maximum visible filesystem usage reported by
            {{ $labels.job }} on {{ $labels.instance }}
            is above 90 percent.

        labels:
          project: llm
          environment: test
          source: grafana
          component: ecs
          metric: disk-space
          severity: high

        notification_settings:
          receiver: alertmanager

        isPaused: false

      - uid: llmdevdisklow
        title: "[llm]-[test]-[ecs]-[low]-[disk-space]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                max by (job, instance) (
                  100 * (
                    1 -
                    (
                      node_filesystem_avail_bytes{
                        job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter",
                        fstype!~"tmpfs|devtmpfs|proc|sysfs|cgroup2?|autofs|mqueue"
                      }
                      /
                      node_filesystem_size_bytes{
