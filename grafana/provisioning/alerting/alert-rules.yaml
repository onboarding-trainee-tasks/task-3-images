        title: "[llm]-[test]-[ecs]-[low]-[memory]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                100 * (
                  1 -
                  (
                    node_memory_MemAvailable_bytes{
                      job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter"
                    }
                    /
                    node_memory_MemTotal_bytes{
                      job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter"
                    }
                  )
                )

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: C
            datasourceUid: __expr__

            model:
              conditions:
                - evaluator:
                    params:
                      - 70
                      - 0
                    type: gt

                  operator:
                    type: and

                  query:
                    params: []

                  reducer:
                    params: []
                    type: avg

                  type: query

              datasource:
                name: Expression
                type: __expr__
                uid: __expr__

              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold

        noDataState: OK
        execErrState: Error
        for: 5m

        annotations:
          summary: "Elevated ECS memory usage"
          description: >-
            Memory usage reported by {{ $labels.job }}
            on {{ $labels.instance }} is above 70 percent.

        labels:
          project: llm
          environment: test
          source: grafana
          component: ecs
          metric: memory
          severity: low

        notification_settings:
          receiver: alertmanager

        isPaused: false

      - uid: llmdevdiskhigh
        title: "[llm]-[test]-[ecs]-[high]-[disk-space]"
        condition: C

        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus

            model:
              datasource:
                type: prometheus
                uid: prometheus

              editorMode: code

              expr: |-
                max by (job, instance) (
                  100 * (
                    1 -
                    (
                      node_filesystem_avail_bytes{
                        job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter",
                        fstype!~"tmpfs|devtmpfs|proc|sysfs|cgroup2?|autofs|mqueue"
                      }
                      /
                      node_filesystem_size_bytes{
                        job=~"(prometheus|grafana|open-webui|ollama|alertmanager)-node-exporter",
                        fstype!~"tmpfs|devtmpfs|proc|sysfs|cgroup2?|autofs|mqueue"
                      }
                    )
                  )
                )

              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A

          - refId: C
