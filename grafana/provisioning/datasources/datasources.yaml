apiVersion: 1

datasources:
  - name: AWS CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      authType: default
      defaultRegion: eu-central-1

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus.llm.local:9090
    isDefault: false
    editable: true

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager.llm.local:9093
    isDefault: false
    editable: true

    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true